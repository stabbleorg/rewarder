[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
anchor-common = { git = "https://github.com/stabbleorg/anchor-common.git", rev = "f982caa0d012352ef563b7f418da7287645bd3bf" }
math = { git = "https://github.com/stabbleorg/amm-sdk.git", rev = "71843f4d848e133e87ce3f42e011b78bf926c5a3" }
